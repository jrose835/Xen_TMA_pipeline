[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xen-tma-pipeline"
version = "0.2.0"
description = "Split a Xenium region bundle into per-punch bundles by hand-drawn coordinates, with QC metrics"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "h5py>=3.10",
    "pyarrow>=15",
    "zarr>=3.1,<3.2",  # 3.2+ removed Group.create_dataset, which transcripts_parquet_to_zarr uses
    "numcodecs>=0.13",
    "scipy>=1.12",
    "tifffile>=2024.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
xen-tma-pipeline = "Xen_TMA_pipeline:main"

[tool.setuptools]
py-modules = ["Xen_TMA_pipeline"]
packages = ["xen_tma_scripts"]

[tool.setuptools.package-dir]
xen_tma_scripts = "scripts"

[tool.pytest.ini_options]
testpaths = ["tests"]
